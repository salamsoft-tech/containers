name: build-images

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  list-changed-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list-changed-images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get changed file's directories
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          dir_names: 'true'

      - name: List changed image directories
        id: list-changed-images
        env:
          CHANGED_DIRS: ${{ steps.changed-files.outputs.all_modified_files }}
        run: |
          # CHANGED_DIRS is a space-separated list of directories and must word-split
          # shellcheck disable=SC2086
          echo "matrix=$(find $CHANGED_DIRS -type f -name Dockerfile -exec dirname {} \; | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build-and-push-image:
    needs: list-changed-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
        matrix:
            image: ${{ fromJson(needs.list-changed-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read image name
        id: image-name
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq eval '.name' ./${{ matrix.image }}/image-info.yaml

      - name: Read image rolling-tags
        id: image-rolling-tags
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq eval '.rolling-tags[]' ./${{ matrix.image }}/image-info.yaml

      - name: Docker metadata
        id: docker-metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.image-name.outputs.result }}
          tags: |
            ${{ steps.image-rolling-tags.outputs.result }}
            type=sha

      - name: Login to registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.docker-metadata.outputs.tags }}
          platforms: linux/amd64,linux/arm64
